<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboEd · Conversation Lab</title><style>body{margin:0;background:#06101c;color:#eaf3f8;font:14px system-ui}main{max-width:1000px;margin:auto;padding:24px}.box{background:#0b1a29;border:1px solid #1b3a52;border-radius:16px;padding:20px}button{padding:10px;border-radius:9px;border:1px solid #1b3a52;background:#10263a;color:#eaf3f8;margin-right:6px}textarea{width:100%;height:100px;background:#081827;color:white;border:1px solid #1b3a52;border-radius:10px;padding:10px}#log{margin-top:15px;line-height:1.6}</style></head><body><main><div class="box"><h1>🤖 RoboEd · Conversation Lab</h1><p>Sandbox visual do Human Conversation Engine.</p><textarea id="i" placeholder="Fale naturalmente…"></textarea><br><br><button onclick="go()">Enviar</button><button onclick="test()">Testar reparo</button><div id="log"></div></div></main><script>const l=document.getElementById("log"),i=document.getElementById("i");function add(a,b){l.innerHTML+="<p><b>"+a+":</b> "+b+"</p>"}function go(){let t=i.value.trim();if(!t)return;add("Você",t);i.value="";let r=/não foi isso|nao foi isso|quis dizer/i.test(t)?"Entendi. Vou atualizar a interpretação anterior e seguir pela sua correção.":/isso|aquilo|ele|ela/i.test(t)?"Detectei uma referência que precisa ser resolvida pelo contexto.":"Entendi. Aqui o motor separa intenção, contexto, memória, grounding e geração.";add("RoboEd",r)}function test(){i.value="Não foi isso que eu quis dizer.";go()}</script></body></html>
